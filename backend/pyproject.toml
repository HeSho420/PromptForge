[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "bpy",
    "mathutils",
    "trimesh.*",
    "scipy.*",
    "anthropic",
    "imageio_ffmpeg",
    "transformers",
    "segment_anything",
]
ignore_missing_imports = true
